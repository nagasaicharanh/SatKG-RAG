[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satkg-rag"
version = "0.1.0"
description = "Satellite Knowledge Graph + Hybrid RAG reference implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.5",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langgraph>=0.2.0",
  "matplotlib>=3.8.0",
  "networkx>=3.3",
  "ollama>=0.3.0",
  "owlready2>=0.46",
  "plotly>=5.24.0",
  "pydantic>=2.8.0",
  "pymupdf>=1.24.0",
  "rdflib>=7.0.0",
  "sentence-transformers>=3.0.0",
  "spacy>=3.7.0",
  "streamlit>=1.37.0",
  "tiktoken>=0.7.0",
  "pyvis>=0.3.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
